name: quieroeso

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: quieroeso
      POSTGRES_PASSWORD: quieroeso
      POSTGRES_DB: quieroeso
    ports:
      - "54320:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quieroeso -d quieroeso"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
